
##Download mirror: only used as FALLBACK now.
##All packages are downloaded from official sources first (nginx.org, php.net,
##cdn.mysql.com, archive.mariadb.org, pecl.php.net, github.com, ...),
##and only fall back to this mirror when the official source is unavailable.
Download_Mirror='https://soft.lnmp.com'

Nginx_Modules_Options=''
PHP_Modules_Options=''

##MySQL/MariaDB database directory##
MySQL_Data_Dir='/usr/local/mysql/var'
MariaDB_Data_Dir='/usr/local/mariadb/var'
##Default website home directory##
Default_Website_Dir='/home/wwwroot/default'

Enable_Nginx_Openssl='y'
Enable_Nginx_Lua='n'
Enable_Ngx_FancyIndex='n'
Enable_Swap='y'
Enable_PHP_Exif='n'
Enable_PHP_Fileinfo='n'
Enable_PHP_Ldap='n'
Enable_PHP_Bz2='n'
Enable_PHP_Sodium='n'
Enable_PHP_Imap='n'

Download_Insecure='n'
Enable_Download_Checksum='y'
